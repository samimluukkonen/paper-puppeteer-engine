<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paper Puppeteer standalone consumer</title>
  </head>
  <body>
    <h1>Standalone runtime consumer</h1>
    <p><a href="./choreography.html">Two Actor scripted scene</a></p>
    <p>Extract an editor character ZIP into public/character/ to try your own export.</p>
    <nav aria-label="Playback">
      <button data-clip="idle" disabled>Idle</button>
      <button data-clip="walk" disabled>Walk</button>
      <button data-clip="sword" disabled>Sword</button>
      <button data-clip="reach" disabled>IK reach</button>
      <button data-clip="baked" disabled>Baked reach</button>
      <button id="skin" disabled>Switch skin</button>
      <button id="dispose">Clean up</button>
    </nav>
    <nav aria-label="Animation controller">
      <button data-state="idle" disabled>Idle state</button>
      <button data-state="walking" disabled>Walking state</button>
      <button data-state="running" disabled>Running state</button>
      <button data-command="queue" disabled>Queue attack + recover</button>
      <button data-command="action" disabled>Attack action</button>
      <button data-command="async" disabled>Await attack</button>
      <button data-command="cancel" disabled>Cancel wait</button>
      <button data-command="stop" disabled>Stop base</button>
    </nav>
    <p id="status" role="status">Loading character…</p>
    <p id="event" aria-live="polite">Waiting for animation event…</p>
    <p id="lifecycle" aria-live="polite">Waiting for playback lifecycle…</p>
    <div id="stage"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

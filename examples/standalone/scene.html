<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Authored scene runtime</title>
  </head>
  <body>
    <h1>Authored scene runtime</h1>
    <p>Scene JSON and character packages played through SceneLoader and SceneRunner.</p>
    <nav aria-label="Scene controls">
      <button id="play" disabled>Play</button>
      <button id="pause" disabled>Pause</button>
      <button id="stop" disabled>Stop</button>
      <label>Time (ms) <input id="time" type="range" min="0" max="3000" value="0" disabled /></label>
      <label>Open scene ZIP <input id="package" type="file" accept=".zip,application/zip" /></label>
      <button id="dispose">Clean up</button>
      <a href="./">Puppet controls</a>
    </nav>
    <p id="status" role="status">Loading…</p>
    <pre id="events" aria-label="Scene cues"></pre>
    <div id="stage"></div>
    <script type="module" src="/src/scene.ts"></script>
  </body>
</html>

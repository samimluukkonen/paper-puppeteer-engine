<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Recommended Animation editor layout</title>
  <desc id="description">Compact navigation and commands above a preview and selection inspector. A full-width timeline below keeps timing controls visible. Help and specialized commands open on demand.</desc>
  <rect width="1200" height="760" fill="#eee8dc"/>
  <g font-family="Segoe UI, sans-serif" fill="#34473e">
    <rect x="16" y="16" width="1168" height="48" rx="5" fill="#39574b"/>
    <text x="32" y="46" font-size="19" fill="#f8f5ec">Animation Editor</text>
    <text x="918" y="45" font-size="13" fill="#f8f5ec">Demo · Rig Editor · Help</text>
    <rect x="16" y="74" width="1168" height="48" rx="5" fill="#f8f5ec" stroke="#b7c0ac"/>
    <text x="32" y="104" font-size="15">Character ▾</text>
    <text x="180" y="104" font-size="15">Animation: walk ▾</text>
    <text x="405" y="104" font-size="15">Undo · Redo</text>
    <text x="602" y="104" font-size="15">Clip settings ▾</text>
    <text x="832" y="104" font-size="15">Unsaved edits</text>
    <text x="1005" y="104" font-size="15" font-weight="600">Download JSON</text>
    <rect x="16" y="132" width="750" height="354" rx="5" fill="#f8f5ec" stroke="#b7c0ac"/>
    <text x="32" y="160" font-size="14">Preview · Facing · Bones · IK</text>
    <text x="391" y="302" text-anchor="middle" font-size="23">Puppet preview</text>
    <text x="391" y="329" text-anchor="middle" font-size="14">Fit artwork to available width and height</text>
    <rect x="776" y="132" width="408" height="354" rx="5" fill="#f8f5ec" stroke="#b7c0ac"/>
    <text x="792" y="160" font-size="14" font-weight="600">Bones ▾ · Search</text>
    <rect x="792" y="174" width="376" height="80" rx="3" fill="#e0e7d6"/>
    <text x="808" y="201" font-size="14">Collapsible bone hierarchy</text>
    <text x="808" y="227" font-size="14">Selection stays in sync with preview</text>
    <text x="792" y="286" font-size="16" font-weight="600">Selection inspector</text>
    <text x="792" y="316" font-size="14">Bone: transforms + explicit key actions</text>
    <text x="792" y="342" font-size="14">Event: time + name + JSON payload</text>
    <text x="792" y="368" font-size="14">Key selection: contextual information</text>
    <text x="792" y="454" font-size="13">Scroll properties within this region</text>
    <path d="M16 496H1184" stroke="#899083" stroke-width="4"/>
    <text x="600" y="516" text-anchor="middle" font-size="11">Resizable divider with keyboard alternative</text>
    <rect x="16" y="526" width="1168" height="218" rx="5" fill="#f8f5ec" stroke="#b7c0ac"/>
    <text x="32" y="553" font-size="14">Play / Pause · Restart · Loop · Speed · Time</text>
    <text x="698" y="553" font-size="14">Key actions · + Event · Snap · Filter · Zoom</text>
    <path d="M16 568H1184 M256 568V744" stroke="#b7c0ac"/>
    <text x="32" y="592" font-size="13">Tracks / properties</text>
    <text x="276" y="592" font-size="13">0 s</text>
    <text x="560" y="592" font-size="13">0.5 s</text>
    <text x="844" y="592" font-size="13">1.0 s</text>
    <text x="1120" y="592" font-size="13">1.5 s</text>
    <rect x="17" y="606" width="1166" height="30" fill="#eee7d9"/>
    <text x="32" y="627" font-size="13">Events</text>
    <text x="32" y="663" font-size="13">▸ torso · timing summary</text>
    <text x="32" y="699" font-size="13">▾ rightForearm</text>
    <text x="50" y="730" font-size="13">Rotation</text>
    <path d="M256 636H1184 M256 672H1184 M256 708H1184" stroke="#d0d8c8"/>
    <text x="410" y="627" font-size="16" fill="#77613b">●</text>
    <g font-size="17" fill="#39574b">
      <text x="278" y="663">◆</text><text x="568" y="663">◆</text><text x="1130" y="663">◆</text>
      <text x="278" y="730">◆</text><text x="704" y="730">◆</text><text x="1130" y="730">◇</text>
    </g>
    <path d="M710 570V744" stroke="#b7543a" stroke-width="2"/>
  </g>
</svg>
